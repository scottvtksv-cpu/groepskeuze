<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f5c63">
<title>Privé</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f5c63'/%3E%3Cpath d='M6 17 16 8l10 9v8H6z' fill='%23faf6ef'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #faf6ef; --card: #ffffff; --ink: #1f2a2c; --muted: #5f6b6d; --line: #e6dfd3;
  --teal: #0f5c63; --teal-soft: #e3f0f0; --terra: #c8553d; --sun: #f2b84b;
  --red: #b42318; --red-soft: #fdecea; --green: #1e7a46; --green-soft: #e4f4ea;
  --amber: #8a5a00; --amber-soft: #fdf1d6; --grey-soft: #efece6;
  --radius: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--teal); }
.wrap { max-width: 960px; margin: 0 auto; padding: 16px 16px 104px; }
.narrow { max-width: 680px; margin: 0 auto; }
[hidden] { display: none !important; }

/* Slot */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
  background: linear-gradient(160deg, #0f5c63 0%, #17757b 55%, #f2b84b 140%); }
.gate-card { background: var(--card); border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.gate-card h1 { font-size: 26px; margin-bottom: 6px; }
.gate-card p { color: var(--muted); margin: 0 0 18px; }
.field { width: 100%; padding: 14px; border: 2px solid var(--line); border-radius: 12px; font: inherit; background: #fff; color: var(--ink); }
.field:focus { outline: none; border-color: var(--teal); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 18px; border: 0; border-radius: 12px;
  background: var(--teal); color: #fff; font-weight: 600; text-decoration: none; min-height: 50px; }
.btn:disabled { opacity: .6; }
.btn.ghost { background: var(--teal-soft); color: var(--teal); }
.err { color: var(--red); font-weight: 600; margin: 10px 0 0; min-height: 24px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.names button { padding: 16px 8px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-weight: 600; min-height: 56px; }
.names button:active { border-color: var(--teal); background: var(--teal-soft); }

/* Kop en navigatie */
.top { position: sticky; top: 0; z-index: 5; background: var(--teal); color: #fff; }
.top-in { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 20px; }
.top small { display: block; opacity: .85; font: 12px/1.3 system-ui, sans-serif; margin-top: 2px; }
.me { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 600; white-space: nowrap; min-height: 40px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-in { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; }
.nav a svg { width: 24px; height: 24px; }
.nav a.on { color: var(--teal); }
.banner { background: var(--sun); color: #3d2c00; padding: 8px 16px; text-align: center; font-size: 13px; font-weight: 600; }
.intro { color: var(--muted); margin: 4px 0 16px; }

/* Raster met villa's */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
.tile { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; }
.tile:active { transform: scale(.99); }
.photo { position: relative; aspect-ratio: 4 / 3; background: linear-gradient(135deg, #cfe3e3, #f3e3c0); display: grid; place-items: center; color: var(--teal); }
.photo svg { width: 36%; height: 36%; opacity: .35; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .chip { position: absolute; left: 8px; top: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.photo .mine { position: absolute; right: 8px; bottom: 8px; background: var(--teal); color: #fff; border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.tile-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.tile h2 { font-size: 16px; }
.loc { color: var(--muted); font-size: 13px; }
.tile .price { margin-top: auto; padding-top: 8px; font-weight: 700; font-size: 16px; }
.tile .price small { font-weight: 500; color: var(--muted); font-size: 12px; }
.todo { color: var(--terra); font-size: 13px; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; background: var(--grey-soft); color: var(--ink); }
.chip.ok { background: var(--green-soft); color: var(--green); }
.chip.deels { background: var(--amber-soft); color: var(--amber); }
.chip.nee, .chip.onbekend { background: var(--red-soft); color: var(--red); }

/* Fiche */
.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600; padding: 8px 0 12px; }
.hero-photo { border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.hero-photo .photo { aspect-ratio: 16 / 10; }
.hero h2 { font-size: 25px; }
.verdict { font-size: 17px; margin: 10px 0 14px; }
.warn { background: var(--red-soft); border: 1px solid #f4c7c1; border-left: 5px solid var(--red); color: var(--red); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
.warn strong { display: block; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; margin-bottom: 4px; }
.warn ul { margin: 0; padding-left: 18px; }
.warn li + li { margin-top: 4px; }
.section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.section h3 { font-size: 17px; margin-bottom: 10px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.fact { background: var(--teal-soft); border-radius: 12px; padding: 10px 12px; }
.fact b { display: block; font: 700 16px/1.25 Georgia, serif; color: var(--teal); }
.fact span { font-size: 12px; color: var(--muted); font-weight: 600; }
.weeks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
@media (min-width: 560px) { .weeks { grid-template-columns: repeat(4, 1fr); } }
.week { border-radius: 10px; padding: 8px 4px; font-size: 12px; font-weight: 700; text-align: center; background: var(--grey-soft); color: var(--muted); }
.week small { display: block; font-weight: 600; font-size: 11px; }
.week.vrij { background: var(--green-soft); color: var(--green); }
.week.nb { background: var(--red-soft); color: var(--red); }
.week.key { outline: 2px solid currentColor; outline-offset: -2px; }
.month { font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; }
.wks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.wk { border-radius: 10px; padding: 6px 4px; text-align: center; font-size: 13px; font-weight: 700; background: var(--grey-soft); color: var(--muted); }
.wk small { display: block; font-size: 11px; font-weight: 600; }
.wk.vrij { background: var(--green-soft); color: var(--green); }
.wk.nb { background: var(--red-soft); color: var(--red); }
.aspect { display: grid; grid-template-columns: 14px 1fr; gap: 4px 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.aspect:first-of-type { border-top: 0; padding-top: 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 4px; background: #b9b4aa; }
.dot.g { background: var(--green); } .dot.m { background: #e0a100; } .dot.s { background: var(--red); }
.aspect b { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.aspect b em { font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
.aspect b em.g { color: var(--green); } .aspect b em.m { color: var(--amber); } .aspect b em.s { color: var(--red); }
.aspect p { grid-column: 2; margin: 0; font-size: 15px; }
.legend { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
dl { margin: 0; }
dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 12px; }
dd { margin: 2px 0 0; }
.said { font-style: italic; color: var(--muted); }
details > summary { cursor: pointer; font-weight: 600; color: var(--teal); padding: 2px 0; }

/* Cijfer geven */
.score { border: 2px solid var(--teal); }
.score h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.status { font: 600 13px system-ui, sans-serif; color: var(--muted); }
.status.ok { color: var(--green); }
.status.bad { color: var(--red); }
.ten { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.ten button { height: 52px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-weight: 700; font-size: 18px; }
.ten button.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 6px 2px 12px; }
textarea.field { min-height: 84px; resize: vertical; margin-top: 6px; }
label.lbl { font-weight: 600; }
.comment { border-top: 1px solid var(--line); padding: 10px 0 0; margin-top: 10px; }
.comment:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.comment b { color: var(--teal); }

/* Rangschikking en opvolging */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.rank { display: flex; gap: 12px; align-items: center; }
.pos { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font: 700 18px Georgia, serif; }
.pos.p1 { background: var(--sun); color: #3d2c00; }
.pos.none { background: var(--grey-soft); color: var(--muted); }
.thumb { flex: none; width: 56px; height: 56px; border-radius: 10px; overflow: hidden; }
.thumb .photo { aspect-ratio: 1; }
.rank-main { flex: 1; min-width: 0; }
.rank-main h2 { font-size: 17px; }
.rank-main a { color: inherit; text-decoration: none; }
.total { font: 700 24px Georgia, serif; white-space: nowrap; }
.total small { font: 500 12px system-ui, sans-serif; color: var(--muted); }
.bar { height: 8px; background: var(--grey-soft); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 999px; }
.given { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.who { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.who b { font-size: 17px; }
.count { font-weight: 700; white-space: nowrap; }
.count.full { color: var(--green); }
.count.zero { color: var(--red); }
.missing { font-size: 14px; color: var(--muted); margin-top: 8px; }
.note { font-size: 13px; color: var(--muted); margin: 0; padding-left: 18px; }
.note li + li { margin-top: 6px; }
.linkbtn { background: none; border: 0; color: var(--teal); font-weight: 600; text-decoration: underline; padding: 8px 0; }
</style>
</head>
<body>
<noscript><p style="padding:24px">Deze pagina heeft JavaScript nodig.</p></noscript>

<div id="gate" class="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <h1>Privépagina</h1>
    <p>Geef de groepscode in om verder te gaan.</p>
    <input class="field" id="code" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Groepscode" aria-label="Groepscode">
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn" id="gateBtn" type="submit">Open</button>
  </form>
</div>

<div id="pick" class="gate" hidden>
  <div class="gate-card">
    <h1>Wie ben jij?</h1>
    <p>Kies je naam. Je cijfers worden onder die naam bewaard.</p>
    <div class="names" id="names"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <div><h1 id="title"></h1><small id="sub"></small></div>
    <button class="me" id="me" type="button" title="Naam wijzigen"></button>
  </div></header>
  <div class="banner" id="banner" hidden></div>
  <main class="wrap" id="view"></main>
  <nav class="nav"><div class="nav-in">
    <a href="#/villas" data-tab="villas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Villa's</a>
    <a href="#/rang" data-tab="rang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Rangschikking</a>
    <a href="#/stemmers" data-tab="stemmers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="m16 8 2 2 3.5-4"/></svg>Wie stemde</a>
  </div></nav>
</div>

<script src="config.js"></script>
<script>
(function () {
'use strict';

var CFG = window.APP_CONFIG || {};
var LEVEL = { g: 'Goed', m: 'Let op', s: 'Zwak', o: 'Onbekend' };
var HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
var DATA = null, ROOM = null, ME = null;
var votes = {};          // sleutel "Naam_villaId" -> {v,k,s,c,t}; s = "0".."10"
var dirty = {};          // sleutels met nog niet bewaarde wijzigingen
var timers = {};

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function toB64(a) { var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
function euro(n) { if (n == null) return null; var d = Math.round(n) === n ? 0 : 2; return '€ ' + n.toLocaleString('nl-BE', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function num(n) { return n.toLocaleString('nl-BE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }

/* ---------- Ontgrendelen ---------- */
async function deriveKeys(code, env) {
  var norm = code.trim().toLowerCase().replace(/\s+/g, '-');
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(env.salt), iterations: env.iter }, km, 768);
  return new Uint8Array(bits);
}
async function decrypt(keys, env) {
  var iv = b64(env.iv), ct = b64(env.ct);
  var signed = new Uint8Array(iv.length + ct.length); signed.set(iv, 0); signed.set(ct, iv.length);
  var mk = await crypto.subtle.importKey('raw', keys.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!(await crypto.subtle.verify('HMAC', mk, b64(env.mac), signed))) throw new Error('code');
  var ek = await crypto.subtle.importKey('raw', keys.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, ek, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}
function roomOf(keys) { var h = ''; for (var i = 64; i < 84; i++) h += keys[i].toString(16).padStart(2, '0'); return h; }

var envelope = null;
async function getEnvelope() {
  if (!envelope) { var r = await fetch('data.enc.json', { cache: 'no-store' }); if (!r.ok) throw new Error('net'); envelope = await r.json(); }
  return envelope;
}
async function unlock(keys) {
  var env = await getEnvelope();
  DATA = await decrypt(keys, env);
  ROOM = roomOf(keys);
  ls('vk.keys', toB64(keys));
}

async function boot() {
  var m = location.hash.match(/^#c=(.+)$/);
  var linkCode = m ? decodeURIComponent(m[1]) : null;
  if (m) history.replaceState(null, '', location.pathname + location.search);
  try {
    if (linkCode) { await unlock(await deriveKeys(linkCode, await getEnvelope())); return enter(); }
    var saved = ls('vk.keys');
    if (saved) { await unlock(b64(saved)); return enter(); }
  } catch (e) { ls('vk.keys', null); }
  $('#gate').hidden = false;
  $('#code').focus();
}

$('#gateForm').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var code = $('#code').value, btn = $('#gateBtn'), err = $('#gateErr');
  if (!code.trim()) return;
  btn.disabled = true; btn.textContent = 'Even geduld…'; err.textContent = '';
  try {
    await unlock(await deriveKeys(code, await getEnvelope()));
    $('#code').value = '';
    $('#gate').hidden = true;
    enter();
  } catch (e) {
    err.textContent = e.message === 'code' ? 'Die code klopt niet. Probeer opnieuw.' : 'Laden lukt niet. Controleer je verbinding.';
  }
  btn.disabled = false; btn.textContent = 'Open';
});

/* ---------- Naam kiezen ---------- */
function enter() {
  document.title = DATA.titel;
  $('#title').textContent = DATA.titel;
  $('#sub').textContent = DATA.groep;
  var saved = ls('vk.naam');
  if (saved && DATA.stemmers.indexOf(saved) >= 0) { ME = saved; start(); } else pickName();
}
function pickName() {
  $('#app').hidden = true;
  $('#names').innerHTML = DATA.stemmers.map(function (n) { return '<button type="button" data-n="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
  $('#pick').hidden = false;
}
$('#names').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  ME = b.dataset.n; ls('vk.naam', ME);
  $('#pick').hidden = true; start();
});
$('#me').addEventListener('click', pickName);

var started = false;
function start() {
  $('#me').textContent = ME + ' ▾';
  $('#app').hidden = false;
  if (!Store.remote) { $('#banner').hidden = false; $('#banner').textContent = 'Testmodus: cijfers blijven enkel op dit toestel.'; }
  if (!started) {
    started = true;
    window.addEventListener('hashchange', route);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
    setInterval(function () { if (!document.hidden) refresh(); }, 45000);
  }
  route(); refresh();
}

/* ---------- Opslag ---------- */
var Store = CFG.projectId ? {
  remote: true,
  url: function (id) {
    var u = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(CFG.projectId) + '/databases/(default)/documents/rooms/' + ROOM + '/votes' + (id ? '/' + encodeURIComponent(id) : '');
    return u + (id ? '?' : '?pageSize=300&') + (CFG.apiKey ? 'key=' + encodeURIComponent(CFG.apiKey) : '');
  },
  list: async function () {
    var out = {}, token = '';
    do {
      var r = await fetch(this.url() + (token ? '&pageToken=' + encodeURIComponent(token) : ''));
      if (!r.ok) throw new Error('list ' + r.status);
      var j = await r.json();
      (j.documents || []).forEach(function (d) {
        var f = d.fields || {}, o = {};
        ['v', 'k', 's', 'c', 't'].forEach(function (x) { o[x] = f[x] && f[x].stringValue != null ? f[x].stringValue : ''; });
        if (o.v && o.k) out[o.v + '_' + o.k] = o;
      });
      token = j.nextPageToken || '';
    } while (token);
    return out;
  },
  save: async function (o) {
    var fields = {}; ['v', 'k', 's', 'c', 't'].forEach(function (x) { fields[x] = { stringValue: o[x] }; });
    var r = await fetch(this.url(o.v + '_' + o.k), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: fields }) });
    if (!r.ok) throw new Error('save ' + r.status);
  }
} : {
  remote: false,
  list: async function () { try { return JSON.parse(ls('vk.local') || '{}'); } catch (e) { return {}; } },
  save: async function (o) { var all = await this.list(); all[o.v + '_' + o.k] = o; ls('vk.local', JSON.stringify(all)); }
};

var loadError = false;
async function refresh() {
  try {
    var fresh = await Store.list();
    Object.keys(dirty).forEach(function (k) { if (votes[k]) fresh[k] = votes[k]; });
    votes = fresh; loadError = false;
  } catch (e) { loadError = true; }
  if (currentTab() !== 'villa' || loadError) route(true);
}

// Een cijfer is geldig van 1 tot 10; al het andere (ook oude testgegevens) telt als "geen cijfer".
function scoreOf(v) { return v && /^(10|[1-9])$/.test(v.s) ? +v.s : 0; }
function myVote(id) {
  var v = votes[ME + '_' + id];
  return { v: ME, k: id, s: String(scoreOf(v)), c: v ? v.c : '', t: v ? v.t : '' };
}
function queueSave(id, delay) {
  var key = ME + '_' + id;
  dirty[key] = true;
  setStatus('Bezig met bewaren…', '');
  clearTimeout(timers[key]);
  timers[key] = setTimeout(function () { doSave(key); }, delay);
}
async function doSave(key) {
  var o = votes[key]; if (!o) return;
  o.t = new Date().toISOString();
  var snapshot = JSON.stringify(o);
  try {
    await Store.save(o);
    if (JSON.stringify(votes[key]) === snapshot) { delete dirty[key]; setStatus('Bewaard ✓', 'ok'); }
  } catch (e) {
    setStatus('Niet bewaard. We proberen opnieuw…', 'bad');
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () { doSave(key); }, 4000);
  }
}
function setStatus(text, cls) { var el = $('#saveStatus'); if (el) { el.textContent = text; el.className = 'status ' + cls; } }
window.addEventListener('beforeunload', function (ev) { if (Object.keys(dirty).length) { ev.preventDefault(); ev.returnValue = ''; } });

/* ---------- Berekeningen ---------- */
function stats(id) {
  var given = [], comments = [];
  DATA.stemmers.forEach(function (n) {
    var v = votes[n + '_' + id]; if (!v) return;
    var s = scoreOf(v);
    if (s) given.push({ n: n, s: s });
    if (v.c && v.c.trim()) comments.push({ n: n, c: v.c.trim() });
  });
  var total = given.length ? given.reduce(function (a, g) { return a + g.s; }, 0) / given.length : null;
  return { given: given, total: total, comments: comments };
}

/* ---------- Weergave ---------- */
function currentTab() {
  var h = location.hash;
  if (h.indexOf('#/villa/') === 0) return 'villa';
  if (h === '#/rang') return 'rang';
  if (h === '#/stemmers') return 'stemmers';
  return 'villas';
}
function route(keepScroll) {
  var tab = currentTab(), y = window.scrollY;
  document.querySelectorAll('.nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.tab === (tab === 'villa' ? 'villas' : tab)); });
  var html = loadError ? '<div class="warn">De cijfers konden niet geladen worden. Controleer je verbinding; we proberen het zo opnieuw.</div>' : '';
  if (tab === 'villa') html += viewVilla(decodeURIComponent(location.hash.slice(8)));
  else if (tab === 'rang') html += viewRank();
  else if (tab === 'stemmers') html += viewVoters();
  else html += viewList();
  $('#view').innerHTML = html;
  window.scrollTo(0, keepScroll === true ? y : 0);
}

function free(p) { return typeof p === 'number'; }
// 'juli' = minstens één juliweek vrij, 'aug' = enkel augustus, 'onbekend' = niet nagekeken, 'geen' = niets vrij
function avail(v) {
  if (v.prijzen.some(free)) return 'juli';
  if (v.aug.some(free)) return 'aug';
  if (v.prijzen.every(function (p) { return p === '?'; })) return 'onbekend';
  return 'geen';
}
function statusChip(v) {
  var a = avail(v);
  if (a === 'aug') return '<span class="chip nee">Niet in juli · enkel augustus</span>';
  if (a === 'onbekend') return '<span class="chip onbekend">Niet nagekeken</span>';
  if (a === 'geen') return '<span class="chip nee">' + (v.aug.every(function (p) { return p === 'nb'; }) ? 'Niet vrij in juli en augustus' : 'Niet vrij in juli') + '</span>';
  return '';
}
function weekBox(cls, label, p, showPrice) {
  var c = free(p) ? 'vrij' : p === 'nb' ? 'nb' : '';
  var t = free(p) ? '✓ vrij' + (showPrice ? '' : '') : p === 'nb' ? '✗ niet vrij' : '? onbekend';
  return '<div class="' + cls + ' ' + c + '"><small>' + esc(label) + '</small>' + t + '</div>';
}
function photo(v, extra) {
  return '<div class="photo">' + HOUSE + (v.foto ? '<img src="' + esc(v.foto) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + (extra || '') + '</div>';
}

function viewList() {
  var order = { juli: 0, aug: 1, onbekend: 2, geen: 3 };
  var list = DATA.villas.slice().sort(function (a, b) { return order[avail(a)] - order[avail(b)] || (a.perGezin || 1e9) - (b.perGezin || 1e9) || a.id - b.id; });
  var done = DATA.villas.filter(function (v) { return scoreOf(votes[ME + '_' + v.id]) > 0; }).length;
  var h = '<p class="intro">Dag ' + esc(ME) + '! Tik op een villa, lees de korte fiche en geef een cijfer op 10. Je gaf er <b>' + done + ' van ' + DATA.villas.length + '</b>.</p><div class="grid">';
  list.forEach(function (v) {
    var s = scoreOf(votes[ME + '_' + v.id]);
    h += '<a class="tile" href="#/villa/' + esc(v.id) + '">' + photo(v, statusChip(v) + (s ? '<span class="mine">' + s + ' / 10</span>' : ''))
      + '<div class="tile-body"><h2>' + esc(v.naam) + '</h2><div class="loc">' + esc(v.vlag) + ' ' + esc(v.regio) + '</div>'
      + '<div class="wks">' + weekBox('wk', 'Week 1 · ' + DATA.juli[0], v.prijzen[0]) + weekBox('wk', 'Week 2 · ' + DATA.juli[1], v.prijzen[1]) + '</div>'
      + (s ? '' : '<div class="todo" style="margin-top:6px">Nog geen cijfer</div>')
      + '<div class="price">' + (v.perGezin != null ? euro(v.perGezin) + ' <small>/ gezin</small>' : '<small>geen prijs voor juli</small>') + '</div></div></a>';
  });
  h += '</div><div class="section narrow" style="margin-top:16px"><details><summary>Afgevallen villa\'s (' + DATA.afgevallen.length + ')</summary><ul class="note" style="margin-top:10px">' + DATA.afgevallen.map(function (a) { return '<li><b>' + esc(a[0]) + '</b>: ' + esc(a[1]) + '</li>'; }).join('') + '</ul></details></div>';
  h += '<div class="section narrow"><details><summary>Over deze gegevens</summary><ul class="note" style="margin-top:10px">' + DATA.noten.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details></div>';
  h += '<p style="text-align:center"><button class="linkbtn" type="button" onclick="vkLogout()">Dit toestel afmelden</button></p>';
  return h;
}

function row(label, value) { return value ? '<dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd>' : ''; }

function viewVilla(id) {
  var v = DATA.villas.filter(function (x) { return x.id === id; })[0];
  if (!v) return '<p>Villa niet gevonden.</p>';
  var mine = myVote(id), cur = +mine.s, st = stats(id);
  var h = '<div class="narrow"><a class="back" href="#/villas">← Alle villa\'s</a>';
  h += '<div class="hero-photo">' + photo(v) + '</div>';
  h += '<div class="hero"><h2>' + esc(v.naam) + '</h2><div class="loc">' + esc(v.vlag) + ' ' + esc(v.ligging) + '</div><p class="verdict">' + esc(v.oordeel) + '</p></div>';
  if (v.waarschuwing.length) h += '<div class="warn" role="note"><strong>Let op: geen eerste keus</strong><ul>' + v.waarschuwing.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>';

  h += '<div class="section"><div class="facts">'
    + '<div class="fact"><b>' + (v.perGezin != null ? euro(v.perGezin) : 'Geen prijs') + '</b><span>per gezin, per week</span></div>'
    + '<div class="fact"><b>' + esc(v.slpk) + ' slpk · ' + esc(v.badk) + ' badk</b><span>slaapkamers en badkamers</span></div>'
    + '<div class="fact" style="grid-column:1 / -1"><b>' + esc(v.rit) + '</b><span>vanuit Gent, zonder pauzes</span></div></div>'
    + '<div class="month">Juli 2027</div><div class="weeks">' + DATA.juli.map(function (w, i) { return weekBox('week' + (i < 2 ? ' key' : ''), (i < 2 ? 'Week ' + (i + 1) + ' · ' : '') + w, v.prijzen[i]); }).join('') + '</div>'
    + '<div class="month">Augustus 2027</div><div class="weeks">' + DATA.augustus.map(function (w, i) { return weekBox('week', w, v.aug[i]); }).join('') + '</div>'
    + (v.augNota ? '<p class="legend">' + esc(v.augNota) + '</p>' : '') + '</div>';

  h += '<div class="section"><h3>In het kort</h3>';
  DATA.aspecten.forEach(function (a, i) {
    var x = v.inschatting[i];
    h += '<div class="aspect"><span class="dot ' + esc(x[0]) + '"></span><b>' + esc(a) + ' <em class="' + esc(x[0]) + '">' + LEVEL[x[0]] + '</em></b><p>' + esc(x[1]) + '</p></div>';
  });
  h += '<p class="legend">Inschatting door Claude op basis van de advertentie. Geen garantie.</p></div>';

  h += '<div class="section score" data-id="' + esc(id) + '"><h3>Jouw cijfer <span class="status" id="saveStatus">' + (cur ? 'Bewaard ✓' : '') + '</span></h3><div class="ten" role="group" aria-label="Cijfer op 10">';
  for (var n = 1; n <= 10; n++) h += '<button type="button" data-n="' + n + '" aria-pressed="' + (cur === n) + '" class="' + (cur === n ? 'on' : '') + '">' + n + '</button>';
  h += '</div><div class="scale"><span>1 = liever niet</span><span>10 = hier wil ik heen</span></div>'
    + '<label class="lbl" for="cmt">Opmerking (optioneel)</label><textarea class="field" id="cmt" maxlength="1000" placeholder="Waarom dit cijfer?">' + esc(mine.c) + '</textarea></div>';

  h += '<a class="btn ghost" style="margin-bottom:12px" href="' + esc(v.link) + '" target="_blank" rel="noopener noreferrer">Bekijk de advertentie en alle foto\'s ↗</a>';

  var others = st.comments.filter(function (c) { return c.n !== ME; });
  if (others.length) h += '<div class="section"><h3>Opmerkingen van de groep</h3>' + others.map(function (c) { return '<div class="comment"><b>' + esc(c.n) + ':</b> ' + esc(c.c) + '</div>'; }).join('') + '</div>';

  h += '<div class="section"><details><summary>Alle details</summary><dl>'
    + row('Advertentie', v.advertentie) + row('Prijs per week (totaal)', euro(v.weekprijs)) + row('Extra kosten en voorwaarden', v.extra)
    + row('Zwembad', v.zwembad) + row('Veiligheid zwembad', v.veiligheid) + row('Troeven voor kinderen', v.kinderen)
    + row('Slaapkamers', v.slpk) + row('Bedden', v.bedden) + row('Badkamers', v.badk) + row('Max. gasten', v.gasten) + row('Airco', v.airco)
    + row('Beoordeling', v.beoordeling) + row('Aandachtspunten', v.aandacht) + row('Bijzonderheden', v.bijzonder) + row('Aangebracht door', v.door)
    + '<dt>Wat de groep al zei</dt><dd class="said">' + esc(v.groepZei) + '</dd></dl></details></div></div>';
  return h;
}

$('#view').addEventListener('click', function (ev) {
  var b = ev.target.closest('.ten button'); if (!b) return;
  var id = b.closest('.score').dataset.id, o = myVote(id), n = +b.dataset.n;
  var val = +o.s === n ? 0 : n;
  o.s = String(val); votes[ME + '_' + id] = o;
  b.parentNode.querySelectorAll('button').forEach(function (x) { var on = +x.dataset.n === val; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  queueSave(id, 500);
});
$('#view').addEventListener('input', function (ev) {
  if (ev.target.id !== 'cmt') return;
  var id = ev.target.closest('.score').dataset.id, o = myVote(id);
  o.c = ev.target.value.slice(0, 1000); votes[ME + '_' + id] = o;
  queueSave(id, 1200);
});

function viewRank() {
  var rows = DATA.villas.map(function (v) { return { v: v, s: stats(v.id) }; });
  rows.sort(function (a, b) { return (b.s.total === null ? -1 : b.s.total) - (a.s.total === null ? -1 : a.s.total) || a.v.id - b.v.id; });
  var h = '<div class="narrow"><p class="intro">Het gemiddelde van alle cijfers op 10. De rangschikking wordt bijgewerkt zodra iemand een cijfer geeft.</p>';
  var pos = 0;
  rows.forEach(function (r) {
    var v = r.v, s = r.s, has = s.total !== null;
    if (has) pos++;
    h += '<div class="card"><div class="rank"><div class="pos ' + (has ? (pos === 1 ? 'p1' : '') : 'none') + '">' + (has ? pos : '–') + '</div>'
      + '<div class="thumb">' + photo(v) + '</div>'
      + '<div class="rank-main"><h2><a href="#/villa/' + esc(v.id) + '">' + esc(v.naam) + '</a></h2><div class="loc">' + s.given.length + ' van ' + DATA.stemmers.length + ' cijfers' + (v.perGezin != null ? ' · ' + euro(v.perGezin) + ' / gezin' : '') + '</div>' + statusChip(v) + '</div>'
      + '<div class="total">' + (has ? num(s.total) + '<small> / 10</small>' : '<small>nog geen</small>') + '</div></div>';
    if (has) {
      h += '<div class="bar"><i style="width:' + (s.total * 10).toFixed(0) + '%"></i></div>';
      h += '<div class="given">' + s.given.map(function (g) { return '<span class="chip">' + esc(g.n) + ' ' + g.s + '</span>'; }).join('') + '</div>';
    }
    if (s.comments.length) h += '<div style="margin-top:12px">' + s.comments.map(function (c) { return '<div class="comment"><b>' + esc(c.n) + ':</b> ' + esc(c.c) + '</div>'; }).join('') + '</div>';
    h += '</div>';
  });
  return h + '</div>';
}

function viewVoters() {
  var total = DATA.villas.length;
  var h = '<div class="narrow"><p class="intro">Wie gaf al een cijfer aan hoeveel villa\'s?</p>';
  DATA.stemmers.forEach(function (n) {
    var missing = [], doneCount = 0;
    DATA.villas.forEach(function (v) { if (scoreOf(votes[n + '_' + v.id])) doneCount++; else missing.push(v.naam); });
    var cls = doneCount === total ? 'full' : doneCount === 0 ? 'zero' : '';
    h += '<div class="card"><div class="who"><b>' + esc(n) + (n === ME ? ' (jij)' : '') + '</b><span class="count ' + cls + '">' + (doneCount === total ? 'Klaar ✓' : doneCount === 0 ? 'Nog niet gestemd' : doneCount + ' van ' + total) + '</span></div>'
      + '<div class="bar"><i style="width:' + (doneCount / total * 100).toFixed(0) + '%"></i></div>'
      + (missing.length && doneCount > 0 ? '<div class="missing">Nog te doen: ' + esc(missing.join(', ')) + '</div>' : '') + '</div>';
  });
  return h + '</div>';
}

window.vkLogout = function () { ls('vk.keys', null); ls('vk.naam', null); location.hash = ''; location.reload(); };

boot();
})();
</script>
</body>
</html>
